semantic_segmentation_pre_conf: "data/configs/semantic_segmentation_pre.yaml"
semantic_segmentation_post_conf: "data/configs/semantic_segmentation_post.yaml"
elevation_filter_conf: "data/configs/elevation_filter.yaml"
ambiguity_filter_pre_conf: "data/configs/ambiguity_filter_pre.yaml"
ambiguity_filter_post_conf: "data/configs/ambiguity_filter_post.yaml"
2d_morphologic_filter_conf: "data/configs/2d_morphologic_filter.yaml"
